# Render Blueprint — deploy CẢ API + UI (1 lần) cho Long Châu Triage Agent.
# Render đọc render.yaml ở repo root. Dashboard: New → Blueprint → chọn repo này.
#
# Sau khi tạo: set OPENAI_API_KEY (secret) cho service API trong dashboard.
# AGENT_API_KEY được generate tự động và share cho cả 2 service qua env group.

envVarGroups:
  - name: longchau-shared
    envVars:
      - key: AGENT_API_KEY
        generateValue: true        # cùng 1 key cho API + UI

services:
  # ── Backend API (FastAPI, Docker multi-stage) ──
  - type: web
    name: longchau-triage-api
    runtime: docker
    repo: https://github.com/anhkiet75/batch02-day12_cloud_infras_and_deployment
    branch: main
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - fromGroup: longchau-shared
      - key: ENVIRONMENT
        value: production
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY        # set thủ công trong dashboard (secret)
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  # ── Streamlit Chatbot UI ──
  - type: web
    name: longchau-chatbot-ui
    runtime: docker
    repo: https://github.com/anhkiet75/batch02-day12_cloud_infras_and_deployment
    branch: main
    rootDir: 06-lab-complete/ui
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    autoDeploy: true
    envVars:
      - fromGroup: longchau-shared   # cùng AGENT_API_KEY (UI tự điền sidebar)
      - key: AGENT_API_URL
        fromService:
          type: web
          name: longchau-triage-api
          property: host             # UI tự prepend https:// nếu thiếu scheme
