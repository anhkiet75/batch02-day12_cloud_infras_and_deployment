services:
  - type: web
    name: vinbank-production-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_VERSION
        value: "1.0.0"
      - key: GOOGLE_API_KEY      # set thủ công trong dashboard (secret)
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: AGENT_API_KEY
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      # REDIS_URL: thêm Render Key Value service rồi map vào đây.
      # Bỏ trống -> agent dùng in-memory store.
