events { worker_connections 256; }

http {
    # Docker embedded DNS — resolve service "agent" động khi scale.
    resolver 127.0.0.11 valid=10s;

    upstream agent_cluster {
        server agent:8000;
        keepalive 16;
    }

    server {
        listen 80;

        # Cho thấy request được phục vụ bởi instance nào (quan sát load balancing).
        add_header X-Served-By $upstream_addr always;

        location / {
            proxy_pass http://agent_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Failover: nếu 1 instance lỗi/timeout/503, thử instance khác.
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 3;
        }
    }
}
